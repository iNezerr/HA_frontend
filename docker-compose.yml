version: '3.8'

services:
  # Frontend service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        # Backend API URL for local development
        - VITE_API_BASE_URL=http://localhost:8000/api
        # Firebase Configuration
        - VITE_FIREBASE_API_KEY=AIzaSyBMKbV0_Im1O-lkBWltXsl1CmA7e3HKBRQ
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
      # Backend API URL for local development
      - VITE_API_BASE_URL=http://localhost:8000/api
      # Firebase Configuration
      - VITE_FIREBASE_API_KEY=AIzaSyBMKbV0_Im1O-lkBWltXsl1CmA7e3HKBRQ
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Development service (optional)
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        # Backend API URL for local development
        - VITE_API_BASE_URL=http://localhost:8000/api
        # Firebase Configuration
        - VITE_FIREBASE_API_KEY=AIzaSyBMKbV0_Im1O-lkBWltXsl1CmA7e3HKBRQ
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      # Backend API URL for local development
      - VITE_API_BASE_URL=http://localhost:8000/api
      # Firebase Configuration
      - VITE_FIREBASE_API_KEY=AIzaSyBMKbV0_Im1O-lkBWltXsl1CmA7e3HKBRQ
    command: npm run dev
    profiles:
      - dev

  # Nginx reverse proxy (optional, for production-like setup)
  nginx-proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
    profiles:
      - production
    restart: unless-stopped

networks:
  default:
    name: hues-apply-frontend
