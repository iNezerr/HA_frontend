version: '3.8'

services:
  # Frontend service for production
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        # Backend API URL for production
        - VITE_API_BASE_URL=https://huesapply-backend-555108752266.africa-south1.run.app/api
        # Firebase Configuration (use production values)
        - VITE_FIREBASE_API_KEY=AIzaSyAVk_1vOd9hUqixUwHKlJhhxI93wU-c9WI
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
      # Backend API URL for production
      - VITE_API_BASE_URL=https://huesapply-backend-555108752266.africa-south1.run.app/api
      # Firebase Configuration
      - VITE_FIREBASE_API_KEY=AIzaSyAVk_1vOd9hUqixUwHKlJhhxI93wU-c9WI
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx reverse proxy for production
  nginx-proxy:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"  # SSL port
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # SSL certificates
    depends_on:
      - frontend
    restart: unless-stopped

networks:
  default:
    name: hues-apply-frontend-prod
